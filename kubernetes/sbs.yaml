apiVersion: apps/v1
kind: Deployment
metadata:
  name: sbs-deployment-fe
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sbs-app-fe
  template:
    metadata:
      labels:
        app: sbs-app-fe
    spec:
      containers:
        - name: sbs-container-fe
          image: asia-southeast1-docker.pkg.dev/sbs-spring-2025/sbs-docker-artifact/sbs-build-fe:prod
          imagePullPolicy: Always
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: sbs-service-fe
spec:
  selector:
    app: sbs-app-fe
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: LoadBalancer